name: Conditional Offset D1 — 2023-only fit and 2024 E5 audit
on:
  push:
    branches:
      - research/input-learning-v1-20261031
    paths:
      - .github/workflows/conditional-offset-d1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install original frozen runtime and tests
        run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Validate all tests including conditional correctness
        run: |
          ruff check .
          pytest -q
      - name: Estimate conditional alpha only on existing 2023 OOF
        run: |
          python -u scripts/run_conditional_offset_d1.py \
            --reference-oof analysis/information_expansion_v1/outer_oof_predictions.csv \
            --e5-2024 analysis/model_ensemble_v1/2024_predictions.csv \
            --output-dir /tmp/conditional_offset_d1
      - name: Preserve derived metrics on independent research branch
        if: always()
        run: |
          if [ ! -d /tmp/conditional_offset_d1 ]; then exit 0; fi
          mkdir -p analysis/input_learning_v1
          cp -f /tmp/conditional_offset_d1/* analysis/input_learning_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/input_learning_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: compare pre-2024 conditional correction to frozen E5'
            git pull --rebase origin research/input-learning-v1-20261031
            git push origin HEAD:research/input-learning-v1-20261031
          fi
