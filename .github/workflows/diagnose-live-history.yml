name: Diagnose live history sources
on:
  push:
    branches: [live-history-2026-db]
    paths: [scripts/diagnose_live_history_sources.py, .github/workflows/diagnose-live-history.yml]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[historical]"
      - run: python scripts/diagnose_live_history_sources.py
