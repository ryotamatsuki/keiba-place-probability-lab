name: Diverse Residual Ensemble D2 — only after verified C1
on:
  push:
    branches:
      - research/input-learning-v1-20261031
    paths:
      - .github/workflows/diverse-ensemble-d2.yml
  workflow_run:
    workflows:
      - Model Families C1 — preregistered CPU CatBoost/LightGBM
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-OOF-ensemble:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'research/input-learning-v1-20261031')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/input-learning-v1-20261031
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned PR32 runtime
        run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Test leakage and same-row metadata
        run: |
          ruff check .
          pytest -q
      - name: Require successful C1 OOF and pre-2024 weights
        run: |
          test -s analysis/input_learning_v1/C_outer_oof_predictions.csv
          python -u scripts/run_diverse_ensemble_d2.py \
            --reference-oof analysis/information_expansion_v1/outer_oof_predictions.csv \
            --c1-oof analysis/input_learning_v1/C_outer_oof_predictions.csv \
            --e5-2024 analysis/model_ensemble_v1/2024_predictions.csv \
            --output-dir /tmp/diverse_ensemble_d2
      - name: Commit derived D2 paired losses and 2023-only stack
        run: |
          mkdir -p analysis/input_learning_v1
          cp -f /tmp/diverse_ensemble_d2/* analysis/input_learning_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/input_learning_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: report actual C1 model diversity and 2023-only stacked corrections'
            git pull --rebase origin research/input-learning-v1-20261031
            git push origin HEAD:research/input-learning-v1-20261031
          fi
