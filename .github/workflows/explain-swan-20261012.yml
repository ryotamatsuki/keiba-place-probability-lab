name: Explain frozen Swan Stakes 2026-10-12 model

on:
  push:
    branches: [explain-swan-20261012]
    paths:
      - .github/workflows/explain-swan-20261012.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact frozen model dependencies
        run: python -m pip install -e ".[dev,historical,modeldev]" -c requirements-scope.txt
      - name: Download historical panel
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Explain frozen predictions with TreeSHAP
        run: python scripts/explain_swan_20261012.py
      - name: Commit interpretable analysis (do not alter locked forecast)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/predictions/2026-10-12_swan/explanation/
          git commit -m "analysis: lock Swan race TreeSHAP model attribution" || true
          git push origin HEAD:explain-swan-20261012
