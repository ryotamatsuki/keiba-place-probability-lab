name: Research F3-derived unordered trio (680 tickets) historical validation
# New experiment run uses audit-restored raw rank results and both source CSVs.
on:
  push:
    branches: [research/tennosho-akiten-preoff-20261101]
    paths: [.github/workflows/f3-trio-bridge-validation.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: f3-trio-bridge-validation
  cancel-in-progress: false

jobs:
  validate-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tennosho-akiten-preoff-20261101
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restore historical dependencies
        run: |
          python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Model strict math tests, source lint and forward lock regression
        run: |
          python -m compileall -q src/keiba_place_lab/trio_bridge_v1.py scripts/research_trio_f3_v1.py
          ruff check --select E4,E7,E9,F src/keiba_place_lab/trio_bridge_v1.py scripts/research_trio_f3_v1.py tests/test_trio_bridge_v1.py
          pytest -q tests/test_trio_bridge_v1.py tests/test_tennosho_preoff_20261101.py
      - name: Restore immutable 2010-2024 historical training panel
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Restore immutable Kaggle original v1 JRA racing results
        run: |
          python - <<'PY'
          import kagglehub
          print(kagglehub.dataset_download(
            'noriyukifurufuru/japan-horse-racing-2010-2025/versions/1',
            output_dir='/tmp/kaggle_for_trio'
          ))
          PY
      - name: Fit 2023-only proxy calibration and score untouched 2024 actual trios
        run: |
          RESULT=$(find /tmp/kaggle_for_trio -name 'keiba_results.csv' -print -quit)
          RACES=$(find /tmp/kaggle_for_trio -name 'keiba_races.csv' -print -quit)
          test -n "$RESULT" && test -n "$RACES"
          test -s analysis/input_learning_v1/A_outer_oof_predictions.csv
          python -u scripts/research_trio_f3_v1.py             --oof-csv analysis/input_learning_v1/A_outer_oof_predictions.csv             --historical-dir /tmp/stage36/data/historical_processed/stage36_freeze_v1             --results-csv "$RESULT"             --races-csv "$RACES"             --preview-csv analysis/tennosho_preoff_20261101/previews/f3_preview_20261031T173406.csv             --bundle-manifest models/tennosho_f3_20261101/manifest.json             --output-dir analysis/trio_f3_v1
      - name: Commit only aggregate historical scores and all-680 preview probabilities
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/trio_f3_v1/
          git commit -m 'research: archive held-out historical trio validation and 680-way forward preview'
          for k in 1 2 3 4 5; do
            git fetch origin research/tennosho-akiten-preoff-20261101
            git rebase origin/research/tennosho-akiten-preoff-20261101
            if git push origin HEAD:research/tennosho-akiten-preoff-20261101; then exit 0; fi
          done
          exit 1
