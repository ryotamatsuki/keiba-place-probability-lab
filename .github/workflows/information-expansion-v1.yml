name: Information Expansion V1 — full scope preregistered ablation
# Rerun after confirmed source coverage and native float64 conversion of nullable panel features.
on:
  push:
    branches:
      - research/information-expansion-v1-20261031
    paths:
      - .github/workflows/information-expansion-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: information-expansion-v1
  cancel-in-progress: false

jobs:
  audit-and-model:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen XGBoost runtime
        run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: No leakage and legacy regression tests
        run: |
          ruff check .
          pytest -q
      - name: Retrieve official-date full 2010–2025 audit panel
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Download and verify original source Kaggle V1
        run: |
          python - <<'PY'
          import kagglehub
          root=kagglehub.dataset_download(
              'noriyukifurufuru/japan-horse-racing-2010-2025/versions/1',
              output_dir='/tmp/kaggle_v1')
          print(root)
          PY
      - name: Build strict history and run full turf/dirt odds-domain experiment
        run: |
          set -euo pipefail
          RESULTS=$(find /tmp/kaggle_v1 -name keiba_results.csv -print -quit)
          RACES=$(find /tmp/kaggle_v1 -name keiba_races.csv -print -quit)
          test -n "$RESULTS" && test -n "$RACES"
          mkdir -p /tmp/information-expansion-v1
          python -u scripts/run_information_expansion_v1.py \
            --historical-dir /tmp/stage36/data/historical_processed/stage36_freeze_v1 \
            --results-csv "$RESULTS" \
            --races-csv "$RACES" \
            --output-dir /tmp/information-expansion-v1
      - name: Commit derived audit scores without raw licensed row files
        if: always()
        shell: bash
        run: |
          if [ ! -d /tmp/information-expansion-v1 ]; then
            echo 'No research output; inspect previous job errors'
            exit 0
          fi
          mkdir -p analysis/information_expansion_v1
          cp -f /tmp/information-expansion-v1/* analysis/information_expansion_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/information_expansion_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: store preregistered full-scope information ablation'
            git pull --rebase origin research/information-expansion-v1-20261031
            git push origin HEAD:research/information-expansion-v1-20261031
          fi
