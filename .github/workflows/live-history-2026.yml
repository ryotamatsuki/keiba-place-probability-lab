name: Build 2026 live history
# Explicit dispatch only: data updates must not race code-only pushes.

on:
  workflow_dispatch:
    inputs:
      through:
        description: Inclusive completion cutoff (YYYY-MM-DD)
        required: true
        default: "2026-10-03"
      recheck_days:
        description: Re-fetch this many recent calendar days
        required: true
        default: "14"
      max_workers:
        description: Concurrent race fetches
        required: true
        default: "3"
      source:
        description: Published result and declared-entry source
        type: choice
        options: [umanity, yahoo]
        default: umanity

permissions:
  contents: write

concurrency:
  group: live-history-2026-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-history-2026-db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verified environment
        run: python -m pip install -e ".[dev,historical,modeldev]" -c requirements-scope.txt
      - name: Rebuild independent official inventory through cutoff
        env:
          THROUGH: ${{ inputs.through }}
        run: |
          python scripts/extract_official_jra.py --year 2026 --workers 3 --compact-excerpts
          python scripts/build_live_history_ledger.py \
            --conditions data/derived/jra_official_conditions_2026.csv --through "$THROUGH"
      - name: Build month checkpoints and publish each verified snapshot
        env:
          THROUGH: ${{ inputs.through }}
          RECHECK_DAYS: ${{ inputs.recheck_days }}
          MAX_WORKERS: ${{ inputs.max_workers }}
          SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$THROUGH" ] || THROUGH="2026-10-03"
          [ -n "$RECHECK_DAYS" ] || RECHECK_DAYS="14"
          [ -n "$MAX_WORKERS" ] || MAX_WORKERS="3"
          [ -n "$SOURCE" ] || SOURCE="umanity"

          checkpoints=(
            2026-01-31 2026-02-28 2026-03-31 2026-04-30
            2026-05-31 2026-06-30 2026-07-31 2026-08-31
            2026-09-30 "$THROUGH"
          )

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for cutoff in "${checkpoints[@]}"; do
            if [[ "$cutoff" > "$THROUGH" ]]; then
              continue
            fi
            current=$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/live_history/2026/current.json")
          print(json.loads(p.read_text())["complete_through"] if p.exists() else "")
          PY
          )
            if [[ -n "$current" && "$current" > "$cutoff" ]]; then
              echo "Checkpoint $cutoff already covered by $current"
              continue
            fi

            echo "=== Building complete snapshot through $cutoff ==="
            python scripts/update_live_history.py --year 2026 --through "$cutoff" \
              --recheck-days "$RECHECK_DAYS" --max-workers "$MAX_WORKERS" --source "$SOURCE" \
              --ledger analysis/live_history_2026/official_race_ledger.csv
            python scripts/qa_live_history_snapshot.py

            git add data/live_history/2026 data/derived/jra_official_2026.csv \
              data/derived/jra_official_conditions_2026.csv analysis/live_history_2026
            if ! git diff --cached --quiet; then
              git commit -m "data: publish 2026 live history through $cutoff"
              git pull --rebase origin live-history-2026-db
              git push origin HEAD:live-history-2026-db
            fi
          done
      - name: Audit current snapshot and reproduce corrected Oct 4 reference
        env:
          THROUGH: ${{ inputs.through }}
        run: |
          [ -n "$THROUGH" ] || THROUGH="2026-10-03"
          python scripts/qa_live_history_snapshot.py
          if [[ "$THROUGH" == "2026-10-03" || "$THROUGH" > "2026-10-03" ]]; then
            python scripts/qa_live_history_reproduction.py \
              --reference-dir analysis/live_history_2026/corrected_trial_reference \
              --output analysis/live_history_2026/common_live_history_reproduction.json
            git add analysis/live_history_2026
            if ! git diff --cached --quiet; then
              git commit -m "qa: reproduce corrected Oct 4 reference from common 2026 history"
              git pull --rebase origin live-history-2026-db
              git push origin HEAD:live-history-2026-db
            fi
          fi
      - name: Show current manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("data/live_history/2026")
          pointer=json.loads((root/"current.json").read_text())
          manifest=json.loads((root/"snapshots"/pointer["snapshot_id"]/"manifest.json").read_text())
          keep={k:manifest[k] for k in (
              "schema_version","snapshot_id","requested_through","complete_through",
              "latest_race_date","expected_races","confirmed_races","missing_race_ids",
              "expected_race_days","confirmed_race_days","rows","entry_rows",
              "history_sha256","entry_audit_sha256","race_ledger_sha256"
          )}
          print(json.dumps(keep, ensure_ascii=False, indent=2))
          PY
