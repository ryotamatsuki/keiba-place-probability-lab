name: Model Calibration C2 — 2023-only learner alpha
on:
  push:
    branches:
      - research/input-learning-v1-20261031
    paths:
      - .github/workflows/model-calibration-c2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Pinned existing research runtime
        run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Regression and proper margin identity
        run: |
          ruff check .
          pytest -q
      - name: Compare each C1 learner's earlier-year-only correction scale
        run: |
          test -s analysis/input_learning_v1/C_outer_oof_predictions.csv
          python -u scripts/run_model_calibration_c2.py \
            --reference-oof analysis/information_expansion_v1/outer_oof_predictions.csv \
            --c1-oof analysis/input_learning_v1/C_outer_oof_predictions.csv \
            --e5-2024 analysis/model_ensemble_v1/2024_predictions.csv \
            --output-dir /tmp/model_calibration_c2
      - name: Commit only derived 2024 candidate diagnostics
        if: always()
        run: |
          if [ ! -f /tmp/model_calibration_c2/C2_manifest.json ]; then exit 0; fi
          mkdir -p analysis/input_learning_v1
          cp -f /tmp/model_calibration_c2/* analysis/input_learning_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/input_learning_v1/
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: report learner-specific 2023-fit logit scaling'
            git pull --rebase origin research/input-learning-v1-20261031
            git push origin HEAD:research/input-learning-v1-20261031
          fi
