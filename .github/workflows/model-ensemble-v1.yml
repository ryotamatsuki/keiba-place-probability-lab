name: Model Ensemble V1 — frozen 2023 fit / 2024 audit
on:
  push:
    branches:
      - research/model-ensemble-v1-20261031
    paths:
      - .github/workflows/model-ensemble-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen PR32 environment
        run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Run source regression and new ensemble tests
        run: |
          ruff check .
          pytest -q
      - name: Run 2023-only alpha and frozen 2024 candidate audit
        run: |
          python -u scripts/run_model_ensemble_v1.py \
            --oof analysis/information_expansion_v1/outer_oof_predictions.csv \
            --output-dir /tmp/model-ensemble-v1
      - name: Commit only derived results (raw row data unchanged)
        if: always()
        shell: bash
        run: |
          if [ ! -f /tmp/model-ensemble-v1/manifest.json ]; then
            echo 'No completed ensemble result, inspect prior step'
            exit 0
          fi
          mkdir -p analysis/model_ensemble_v1
          cp -f /tmp/model-ensemble-v1/* analysis/model_ensemble_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/model_ensemble_v1
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: publish preregistered 2024 ensemble additivity audit'
            git pull --rebase origin research/model-ensemble-v1-20261031
            git push origin HEAD:research/model-ensemble-v1-20261031
          fi
