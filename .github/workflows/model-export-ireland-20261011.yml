name: Ireland Trophy frozen nonmarket pre-race inference
on:
  push:
    branches:
      - work/ireland-trophy-20261011-model-export
    paths:
      - .github/workflows/model-export-ireland-20261011.yml
      - scripts/infer_ireland_trophy_20261011.py
permissions:
  actions: read
  contents: write
jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install exact frozen model dependencies
        run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Download immutable historical baseline
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Build exact race roster and as-of history
        run: python -u scripts/infer_ireland_trophy_20261011.py
      - name: Score frozen XGBoost turf_G0
        run: |
          python -u scripts/run_stage4_scope_v3.py predict \
            --roster analysis/ireland_20261011_shadow/roster.csv \
            --history /tmp/ireland_prediction_history.parquet \
            --max-history-age-days 8 \
            --output analysis/ireland_20261011_shadow/predictions.csv
      - name: Validate output and publish to experiment branch
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path("analysis/ireland_20261011_shadow/predictions.csv")
          df=pd.read_csv(p)
          assert len(df)==16
          assert df.horse_no.nunique()==16
          n=int(df.p_nonmarket.notna().sum())
          assert n>=10, f"Unexpected ineligibility: {n}"
          assert df.p_nonmarket.dropna().between(0,1).all()
          print("MODEL_PRE_RACE_OUTPUT", df[["horse_no","horse_name","p_nonmarket","route","model_id"]].sort_values("p_nonmarket",ascending=False).to_string(index=False))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/ireland_20261011_shadow/
          git commit -m 'analysis: publish frozen shadow probabilities for 2026 Ireland Trophy'
          git push origin HEAD:work/ireland-trophy-20261011-model-export
