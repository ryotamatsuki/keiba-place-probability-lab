name: Ireland Trophy 2026-10-11 frozen model prediction

on:
  push:
    branches: [predict-ireland-trophy-20261011]
    paths:
      - .github/workflows/predict-ireland-20261011.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact frozen scope environment
        run: python -m pip install -e ".[dev,historical,modeldev]" -c requirements-scope.txt
      - name: Download frozen 2010-2025 historical source
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Extend audited 2026 results through October 4
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          from keiba_place_lab.live_history import CachedFetcher,parse_race_list
          p=Path("analysis/live_history_2026/official_race_ledger.csv")
          original=pd.read_csv(p,dtype={"race_id":"string","provider_id":"string","meeting_day_id":"string"})
          fetcher=CachedFetcher(Path("/tmp/ireland_oct4_schedule"),pause_seconds=0.5)
          additions=[]
          for day in ["26050402","26080402"]:
              url=f"https://sports.yahoo.co.jp/keiba/race/list/{day}"
              html,record=fetcher.fetch(url)
              frame=parse_race_list(html,meeting_day_id=day)
              assert pd.to_datetime(frame.race_date).dt.date.astype(str).eq("2026-10-04").all()
              frame["race_status"]="expected_result"
              frame["schedule_source_url"]=url
              frame["schedule_row_text"]=frame.schedule_row_text.astype(str)
              additions.append(frame)
          ledger=pd.concat([original,*additions],ignore_index=True,sort=False)
          ledger["race_date"]=pd.to_datetime(ledger.race_date,format="mixed").dt.strftime("%Y-%m-%d")
          ledger=ledger.sort_values(["race_date","race_id"])
          assert not ledger.race_id.duplicated().any()
          new=Path("/tmp/ireland_20261004_ledger.csv")
          ledger.to_csv(new,index=False)
          new.with_suffix(".manifest.json").write_text(json.dumps({"through":"2026-10-04","ledger_sha256":hashlib.sha256(new.read_bytes()).hexdigest(),"source":"JRA official through 2026-10-03 plus Yahoo confirmed meeting-day listings for 2026-10-04"},ensure_ascii=False))
          print("Target 2026-10-04 race inventory:",sum(x.target_flat.sum() for x in additions),flush=True)
          PY
          python scripts/update_live_history.py --year 2026 --through 2026-10-04 --source umanity --max-workers 3 --recheck-days 0 --ledger /tmp/ireland_20261004_ledger.csv --root data/live_history/2026
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("data/live_history/2026")
          pointer=json.loads((root/"current.json").read_text())
          snap=root/"snapshots"/pointer["snapshot_id"]
          manifest=json.loads((snap/"manifest.json").read_text())
          assert manifest["complete_through"] == "2026-10-04"
          assert manifest["expected_races"] == manifest["confirmed_races"]
          assert not manifest["missing_race_ids"]
          assert manifest["source_parser_contract"] == "time_margin_separated_v1"
          for filename,key in [("jra_flat_history.parquet","history_sha256"),("entry_audit.parquet","entry_audit_sha256"),("race_ledger.csv","race_ledger_sha256")]:
              assert hashlib.sha256((snap/filename).read_bytes()).hexdigest()==manifest[key]
          print("Independent JRA inventory cutoff is 2026-10-03; snapshot source-level audit PASS", pointer["snapshot_id"])
          PY
      - name: Create complete official race roster with resolved horse IDs
        shell: bash
        run: |
          mkdir -p analysis/predictions/2026-10-11_ireland
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          base=Path("/tmp/stage36/data/historical_processed/stage36_freeze_v1/standardized_jra_flat_source_v1.parquet")
          pointer=json.loads(Path("data/live_history/2026/current.json").read_text())
          live_path=Path("data/live_history/2026/snapshots")/pointer["snapshot_id"]/"jra_flat_history.parquet"
          history=pd.concat([pd.read_parquet(base)[["race_date","horse_name","horse_id"]],pd.read_parquet(live_path)[["race_date","horse_name","horse_id"]]],ignore_index=True)
          history["race_date"]=pd.to_datetime(history.race_date)
          history=history.sort_values("race_date")
          names=[
          ("ニシノティアモ",5,55),("チェルビアット",4,55),("クイーンズウォーク",5,55),("クランフォード",5,55),
          ("カネラフィーナ",4,55),("ムイ",4,55),("ミラビリスマジック",5,55),("ルージュソリテール",4,55),
          ("ウイントワイライト",4,55),("セキトバイースト",5,55),("ラヴァンダ",5,56),("ミアネーロ",5,55),
          ("ワタシマツワ",4,55),("ハワイアンティアレ",5,55),("ジョスラン",4,55),("カムニャック",4,56)
          ]
          rows=[]
          for i,(name,age,weight) in enumerate(names,1):
              matching=history.loc[history.horse_name.eq(name)]
              ids=matching.loc[matching.horse_id.astype(str).str.startswith(str(2026-age)),"horse_id"].astype(str).unique().tolist()
              if len(ids)!=1: raise ValueError(f"Missing/ambiguous horse ID for {name}: {ids}")
              rows.append(dict(race_id="202605040411",race_date="2026-10-11",racecourse="東京",surface="turf",distance_m=1800,
                 turn_direction="left",race_class="Open",horse_id=ids[0],horse_name=name,horse_no=i,sex="F",age=age,
                 assigned_weight_kg=float(weight),field_size=16,declared_field_size=16))
          out=Path("analysis/predictions/2026-10-11_ireland/roster.csv")
          pd.DataFrame(rows).to_csv(out,index=False)
          print(pd.DataFrame(rows)[["horse_no","horse_name","horse_id"]].to_string(index=False))
          PY
      - name: Infer genuine out-of-sample place probabilities with frozen model
        run: |
          python scripts/run_stage4_scope_v3.py predict \
            --roster analysis/predictions/2026-10-11_ireland/roster.csv \
            --historical-base /tmp/stage36/data/historical_processed/stage36_freeze_v1/standardized_jra_flat_source_v1.parquet \
            --live-history-root data/live_history/2026 \
            --output analysis/predictions/2026-10-11_ireland/shadow_probabilities.csv
          python - <<'PY'
          import pandas as pd
          p="analysis/predictions/2026-10-11_ireland/shadow_probabilities.csv"
          d=pd.read_csv(p)
          print(d.sort_values("p_nonmarket",ascending=False)[["horse_no","horse_name","p_nonmarket","route","model_id"]].to_string(index=False))
          assert d.shape[0]==16
          assert d.p_nonmarket.notna().sum()>=12
          assert d.model_id.dropna().eq("turf_G0").all()
          PY
      - name: Commit prediction evidence to analysis branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/predictions/2026-10-11_ireland data/live_history/2026/current.json data/live_history/2026/snapshots
          git commit -m "forecast: lock Ireland Trophy frozen shadow model probabilities" || true
          git push origin HEAD:predict-ireland-trophy-20261011
