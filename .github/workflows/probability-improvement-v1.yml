name: Probability Improvement V1 research (frozen)
# Rerun after reviewed source and fixture fixes; protocol unchanged.
# Reproduce full set after C OOF success; report global market-only decision.
on:
  push:
    branches:
      - research/probability-improvement-v1-20261031
    paths:
      - .github/workflows/probability-improvement-v1.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned reproduction environment
        run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Lint and existing regression tests
        run: |
          ruff check .
          pytest -q
      - name: Download audited frozen 2010-2025 panel artifact
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Download exact CC0 Kaggle version-one final odds source
        run: |
          python - <<'PY'
          import kagglehub
          print(kagglehub.dataset_download(
              'noriyukifurufuru/japan-horse-racing-2010-2025/versions/1',
              output_dir='/tmp/kaggle_v1',
          ))
          PY
      - name: Preregistered A and 2024 B1 shadow execution
        run: |
          RESULTS=$(find /tmp/kaggle_v1 -name keiba_results.csv -print -quit)
          test -n "$RESULTS"
          python -u scripts/run_probability_improvement_v1.py \
            --historical-dir /tmp/stage36/data/historical_processed/stage36_freeze_v1 \
            --results-csv "$RESULTS" \
            --phase3a-oof analysis/stage4_successor_phase3a/phase3a_outer_predictions.csv \
            --output-dir /tmp/probability-improvement-v1
      - name: B2 prior-only correction experiment
        run: |
          python -u scripts/run_probability_improvement_b2_v1.py \
            --historical-dir /tmp/stage36/data/historical_processed/stage36_freeze_v1 \
            --a-oof /tmp/probability-improvement-v1/A_oof_predictions.csv \
            --output-dir /tmp/probability-improvement-v1
      - name: Joint gate against market-only using all frozen A, B and C candidates
        shell: bash
        run: |
          set -euo pipefail
          for part in C AC; do
            cp "analysis/probability_improvement_v1/${part}_oof_predictions.csv" /tmp/probability-improvement-v1/
          done
          python -u scripts/run_probability_improvement_joint_v1.py \
            --input-dir /tmp/probability-improvement-v1 \
            --output-dir /tmp/probability-improvement-v1 \
            --with-c
      - name: Clarify staged manifests and RESULT after all candidate checks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/probability-improvement-v1')
          path = root/'manifest.json'
          manifest = json.loads(path.read_text())
          manifest['B2'] = 'Evaluated separately: B2_manifest.json; pairwise one-SE pass, global market retained'
          manifest['C'] = 'Evaluated in independently frozen C run; C_manifest.json in branch'
          manifest['joint_gate'] = 'A1_market_only retained (JOINT_manifest.json)'
          path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          result = root/'RESULT.md'
          content = result.read_text()
          content = content.replace(
              '**B2 and C unavailable** until the complete leakage-safe feature/context and prior OOF are built.',
              '**B2 and C have now been evaluated.** See B2_manifest.json, C_manifest.json '
              'and JOINT_manifest.json. B2 individually clears one SE but the global '
              'market-only incumbent remains retained.')
          result.write_text(content)
          PY
      - name: Commit rights-cleared derived diagnostics (GitHub artifact quota exhausted)
        if: always()
        shell: bash
        run: |
          if [ ! -d /tmp/probability-improvement-v1 ]; then
            echo "No research output to publish"
            exit 0
          fi
          mkdir -p analysis/probability_improvement_v1
          cp -f /tmp/probability-improvement-v1/* analysis/probability_improvement_v1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/probability_improvement_v1/
          if ! git diff --cached --quiet; then
            git commit -m "analysis: publish historical final-odds research V1 diagnostics"
            git pull --rebase origin research/probability-improvement-v1-20261031
            git push origin HEAD:research/probability-improvement-v1-20261031
          fi
