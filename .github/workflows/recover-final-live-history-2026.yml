name: Recover final 2026 live history from audited reparse artifacts

on:
  workflow_dispatch:
  push:
    branches: [live-history-2026-db]
    paths:
      - .github/workflows/recover-final-live-history-2026.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-live-history-2026
  cancel-in-progress: true

jobs:
  recover:
    name: Repair cached reparse, audit, reproduce, publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-history-2026-db
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verified environment
        run: python -m pip install -e ".[dev,historical,modeldev]" -c requirements-scope.txt
      - name: Download full-page reparse shards from audited source run
        uses: actions/download-artifact@v4
        with:
          pattern: live-history-reparse-*
          path: /tmp/live-history-shards
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 37173601815
      - name: Apply audited straight-course passage-rank correction
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path("/tmp/live-history-shards")
          report = {"source_run_id": 37173601815, "shards": [], "changed_history_rows": 0,
                    "changed_entry_rows": 0}
          for manifest_path in sorted(root.rglob("manifest.json")):
              d = manifest_path.parent
              history_path = d / "jra_flat_history.parquet"
              entry_path = d / "entry_audit.parquet"
              if not history_path.exists() or not entry_path.exists():
                  continue
              h = pd.read_parquet(history_path)
              e = pd.read_parquet(entry_path)
              hm = h["turn_direction"].astype(str).eq("straight")
              em = e["turn_direction"].astype(str).eq("straight")
              hfinite = hm & pd.to_numeric(h["early_position"], errors="coerce").notna()
              efinite = em & pd.to_numeric(e["early_position"], errors="coerce").notna()
              h.loc[hm, "early_position"] = np.nan
              e.loc[em, "early_position"] = np.nan
              h.to_parquet(history_path, index=False)
              e.to_parquet(entry_path, index=False)
              sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
              manifest = json.loads(manifest_path.read_text())
              manifest["history_sha256"] = sha(history_path)
              manifest["entry_audit_sha256"] = sha(entry_path)
              manifest["postparse_correction"] = {
                  "contract": "straight_course_early_position_missing_v1",
                  "history_rows_changed": int(hfinite.sum()),
                  "entry_rows_changed": int(efinite.sum()),
              }
              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
              summary_path = d / "shard_summary.json"
              if summary_path.exists():
                  summary = json.loads(summary_path.read_text())
                  summary["history_sha256"] = manifest["history_sha256"]
                  summary["postparse_correction"] = manifest["postparse_correction"]
                  summary_path.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + "\n")
              report["changed_history_rows"] += int(hfinite.sum())
              report["changed_entry_rows"] += int(efinite.sum())
              report["shards"].append({
                  "dir": d.name,
                  "straight_history_rows": int(hm.sum()),
                  "history_rows_changed": int(hfinite.sum()),
                  "entry_rows_changed": int(efinite.sum()),
              })
          if len(report["shards"]) != 10:
              raise SystemExit(f"Expected 10 shards, found {len(report['shards'])}")
          Path("analysis/live_history_2026/straight_course_correction.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Merge into final immutable snapshot
        run: |
          PYTHONPATH=src python scripts/finalize_live_history_2026.py merge \
            --through 2026-10-03 \
            --shards /tmp/live-history-shards
      - name: Independent whole-snapshot audit
        run: |
          PYTHONPATH=src python scripts/qa_live_history_snapshot.py \
            --output analysis/live_history_2026/snapshot_audit.json
      - name: Download frozen 2010-2025 Stage 3.6 artifact
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ github.token }}
          run-id: 37104212189
      - name: Locate exact frozen historical base
        shell: bash
        run: |
          set -euo pipefail
          HIST_BASE=$(python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = "d8bf137d851a241bb29be7518f1ea6bbcda4aa3dcc350ae03c081ee93d099127"
          for path in Path("/tmp/stage36").rglob("*.parquet"):
              if hashlib.sha256(path.read_bytes()).hexdigest() == expected:
                  print(path)
                  raise SystemExit(0)
          raise SystemExit("Exact frozen 2010-2025 historical base not found in Stage 3.6 artifact")
          PY
          )
          echo "HIST_BASE=$HIST_BASE" >> "$GITHUB_ENV"
          echo "Frozen base: $HIST_BASE"
      - name: Reproduce corrected 35-runner reference
        run: |
          PYTHONPATH=src python scripts/qa_live_history_reproduction.py \
            --historical-base "$HIST_BASE" \
            --reference-dir analysis/live_history_2026/corrected_trial_reference \
            --output analysis/live_history_2026/common_live_history_reproduction.json
      - name: Smoke-test production prediction CLI on both Oct 4 races
        shell: bash
        run: |
          set -euo pipefail
          rm -rf analysis/live_history_2026/cli_smoke
          mkdir -p analysis/live_history_2026/cli_smoke
          for race_id in 202608040211 202605040211; do
            PYTHONPATH=src python scripts/run_stage4_scope_v3.py predict \
              --roster "analysis/live_trial_20261004/${race_id}_roster.csv" \
              --historical-base "$HIST_BASE" \
              --live-history-root data/live_history/2026 \
              --output "analysis/live_history_2026/cli_smoke/${race_id}.csv"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path("analysis/live_history_2026")
          ref = pd.read_csv(root / "corrected_trial_reference/morning_nonmarket_predictions.csv",
                            dtype={"race_id":"string","horse_id":"string"})
          parts = [pd.read_csv(p, dtype={"race_id":"string","horse_id":"string"})
                   for p in sorted((root / "cli_smoke").glob("*.csv"))]
          got = pd.concat(parts, ignore_index=True)
          keys = ["race_id","horse_id"]
          merged = got[keys+["p_nonmarket"]].merge(
              ref[keys+["p_nonmarket"]], on=keys, how="outer",
              suffixes=("_got","_ref"), validate="one_to_one", indicator=True)
          if len(merged) != 35 or not merged["_merge"].eq("both").all():
              raise SystemExit("CLI smoke roster mismatch")
          delta = float(np.max(np.abs(merged.p_nonmarket_got - merged.p_nonmarket_ref)))
          if delta > 1e-7:
              raise SystemExit(f"CLI corrected-reference mismatch: {delta}")
          (root / "cli_smoke/audit.json").write_text(json.dumps({
              "status":"PASS","runners":35,"races":2,
              "prediction_max_abs_error":delta
          }, indent=2) + "\n")
          print(json.dumps({"status":"PASS","runners":35,"prediction_max_abs_error":delta}, indent=2))
          PY
      - name: Run live-history regression tests
        run: |
          pytest -q tests/test_live_history.py tests/test_live_snapshot_loading.py tests/test_live_public.py tests/test_live_umanity.py
      - name: Write completion record
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("analysis/live_history_2026")
          finalization = json.loads((root / "finalization_report.json").read_text())
          snapshot = json.loads((root / "snapshot_audit.json").read_text())
          reproduction = json.loads((root / "common_live_history_reproduction.json").read_text())
          cli = json.loads((root / "cli_smoke/audit.json").read_text())
          correction = json.loads((root / "corrected_trial_reference/correction_audit.json").read_text())
          model = json.loads(Path("models/stage4_scope_v3/manifest.json").read_text())
          record = {
              "status": "PASS",
              "complete_through": snapshot["complete_through"],
              "snapshot_id": snapshot["snapshot_id"],
              "expected_races": snapshot["expected_races"],
              "confirmed_races": snapshot["confirmed_races"],
              "expected_race_days": snapshot["expected_race_days"],
              "confirmed_race_days": snapshot["confirmed_race_days"],
              "rows": snapshot["rows"],
              "entry_rows": snapshot["entry_rows"],
              "missing_race_ids": snapshot["missing_race_ids"],
              "history_sha256": snapshot["history_sha256"],
              "source_parser_contract": snapshot["source_parser_contract"],
              "time_correction_impact": finalization["time_correction_impact_through_previous_cutoff"],
              "reproduction": {
                  "status": reproduction["status"],
                  "runners": reproduction["runners"],
                  "races": reproduction["races"],
                  "feature_max_abs_error": reproduction["feature_max_abs_error"],
                  "prediction_max_abs_error": reproduction["prediction_max_abs_error"],
                  "historical_base_mode": reproduction["historical_base_mode"],
                  "historical_base_sha256": reproduction["historical_base_sha256"],
              },
              "cli_smoke": cli,
              "model_bundle_sha256": model["bundle_sha256"],
              "model_changed": reproduction["model_changed"],
              "original_locked_reference_gate_passed": correction["original_1e_minus7_reproduction_gate_passed"],
              "original_locked_prediction_max_abs_delta": correction["original_prediction_max_abs_delta"],
          }
          if record["model_bundle_sha256"] != "2135442ac31e6489bd209ca338694455b3b887569392f045b5228fc58c59321b":
              raise SystemExit("Frozen model SHA changed")
          if record["historical_base_mode"] != "full_frozen_base":
              raise SystemExit("Full 2010-2025 base was not used")
          (root / "completion_record.json").write_text(json.dumps(record, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps(record, ensure_ascii=False, indent=2))
          PY
      - name: Commit final snapshot and QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/live_history/2026 analysis/live_history_2026
          git commit -m "data: finalize corrected 2026 live history through Oct 3"
          git pull --rebase origin live-history-2026-db
          git push origin HEAD:live-history-2026-db

