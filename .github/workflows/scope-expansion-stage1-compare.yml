name: Scope Expansion Stage 1 comparison

on:
  push:
    branches: [scope-expansion-stage1-compare]
    paths:
      - scripts/run_scope_expansion_stage1.py
      - .github/workflows/scope-expansion-stage1-compare.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,historical,modeldev]"
      - name: Unit tests
        run: |
          ruff check .
          pytest -q tests/test_scope_expansion.py tests/test_stage4_successor_phase3a.py tests/test_model_selection.py
      - name: Download frozen Stage 3.6 panel
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Run frozen A/B/C comparison
        run: |
          python -u scripts/run_scope_expansion_stage1.py \
            --historical-dir /tmp/stage36/data/historical_processed/stage36_freeze_v1 \
            --phase3a-reference analysis/stage4_successor_phase3a/phase3a_outer_predictions.csv \
            --output-dir analysis/scope_expansion_stage1
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: scope-expansion-stage1-comparison
          path: analysis/scope_expansion_stage1/
          if-no-files-found: error
          retention-days: 90
      - name: Commit comparison outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/scope_expansion_stage1/
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: record Scope Expansion Stage 1 comparison'
            git pull --rebase origin scope-expansion-stage1-compare
            git push origin HEAD:scope-expansion-stage1-compare
          fi
