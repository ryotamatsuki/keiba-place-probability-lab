name: Scope V3 strict OOF SHAP audit

on:
  push:
    branches: [scope-v3-shap-audit, scope-v3-shap-audit-fix]
    paths:
      - scripts/run_scope_v3_shap_audit.py
      - .github/workflows/scope-v3-shap-audit.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: scope-v3-shap-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install exact scope environment
        run: python -m pip install -e ".[dev,historical,modeldev]" -c requirements-scope.txt
      - name: Lint audit script
        run: ruff check scripts/run_scope_v3_shap_audit.py
      - name: Download frozen Stage 3.6 panel
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Run strict OOF SHAP audit
        shell: bash
        run: |
          set -euo pipefail
          PANEL=$(find /tmp/stage36 -name 'jra_flat_historical_panel_v1.parquet' -print -quit)
          test -n "$PANEL"
          python -u scripts/run_scope_v3_shap_audit.py             --panel "$PANEL"             --output-dir analysis/scope_v3_shap
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: scope-v3-shap-audit
          path: analysis/scope_v3_shap/
          if-no-files-found: error
          retention-days: 90
      - name: Commit measured outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/scope_v3_shap/
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: record Scope V3 strict OOF SHAP audit'
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
