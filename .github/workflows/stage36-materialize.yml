name: Stage 3.6 materialize historical training dataset
on:
  push:
    branches: [main]
    paths:
      - data/derived/jra_official_*.csv
      - scripts/freeze_historical_panel.py
      - scripts/stage36_official_supplement.py
      - tests/test_historical_source.py
      - .github/workflows/stage36-materialize.yml
      - src/keiba_place_lab/historical_panel.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage36-materialize
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -e '.[dev,historical]' tabulate
      - run: ruff check . && pytest -q
      - run: python -u scripts/freeze_historical_panel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage36-historical-training-panel-v1
          path: |
            data/historical_processed/stage36_freeze_v1/
            docs/HISTORICAL_*.csv
            docs/HISTORICAL_PANEL_QA_REPORT.md
            docs/HISTORICAL_PANEL_FREEZE_V1.md
          retention-days: 90
      - name: Commit computed QA and date map (no raw data)
        # Never commit stale checkout copies when materialization/QA failed.
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HISTORICAL_*.csv docs/HISTORICAL_PANEL_QA_REPORT.md docs/HISTORICAL_PANEL_FREEZE_V1.md docs/HISTORICAL_PANEL_QA.json data/derived/jra_race_date_map_2010_2025.csv
          if ! git diff --cached --quiet; then
            git commit -m 'data: record measured historical panel QA and fingerprints'
            git pull --rebase origin main
            git push
          fi
