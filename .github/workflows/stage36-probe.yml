name: Stage 3.6 historical source probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage36-probe.yml"
      - "scripts/probe_historical_source.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: python -m pip install --upgrade kagglehub pandas pyarrow

      - name: Probe primary Kaggle source
        run: python scripts/probe_historical_source.py

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: stage36-source-probe
          path: |
            docs/HISTORICAL_SOURCE_PROBE.md
            docs/HISTORICAL_SOURCE_FILES.csv
          retention-days: 14

      - name: Commit probe metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HISTORICAL_SOURCE_PROBE.md docs/HISTORICAL_SOURCE_FILES.csv
          if git diff --cached --quiet; then
            echo "No probe metadata changes."
          else
            git commit -m "data: record Stage 3.6 source probe [skip ci]"
            git push
          fi
