name: Stage 3.6 secondary source probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage36-secondary-probe.yml"
      - "scripts/probe_secondary_source.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade kagglehub
      - run: python scripts/probe_secondary_source.py
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/HISTORICAL_SECONDARY_SOURCE_PROBE.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: record secondary historical source probe [skip ci]"
            git push
          fi
