name: Stage 4 non-market baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/keiba_place_lab/nonmarket.py"
      - "scripts/run_stage4_nonmarket.py"
      - "tests/test_nonmarket.py"
      - "analysis/2026-10-03_kyoto11_opal/canonical_nonmarket_features_v1.csv"
      - "analysis/2026-10-03_kyoto11_opal/STAGE4_BASELINE_SPEC_V2.md"
      - ".github/workflows/stage4-nonmarket.yml"

permissions:
  actions: read
  contents: read

jobs:
  fit-validate-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,historical]"
      - name: Unit tests
        run: pytest -q tests/test_nonmarket.py
      - name: Download frozen Stage 3.6 panel
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Fit Stage 4 and evaluate untouched 2025 test
        run: |
          python -u scripts/run_stage4_nonmarket.py \
            --historical-dir /tmp/stage36/data/historical_processed/stage36_freeze_v1 \
            --target analysis/2026-10-03_kyoto11_opal/canonical_nonmarket_features_v1.csv \
            --output-dir /tmp/stage4-results
      - name: Upload Stage 4 results
        uses: actions/upload-artifact@v4
        with:
          name: stage4-nonmarket-baseline-results
          path: /tmp/stage4-results/
          if-no-files-found: error
          retention-days: 90
