name: Stage 4 successor phase 1 diagnostics

on:
  push:
    branches: [stage4-successor-phase1]
    paths:
      - docs/STAGE4_SUCCESSOR_PHASE1_SPEC.md
      - scripts/run_stage4_successor_phase1.py
      - src/keiba_place_lab/stage4_successor.py
      - tests/test_stage4_successor.py
      - .github/workflows/stage4-successor-phase1.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: stage4-successor-phase1
  cancel-in-progress: true

jobs:
  diagnose-incumbent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,historical]"
      - name: Unit tests
        run: |
          ruff check .
          pytest -q tests/test_model_selection.py tests/test_stage4_successor.py tests/test_nonmarket.py
      - name: Download frozen Stage 3.6 panel
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Run Phase 1 incumbent diagnostics
        run: |
          python -u scripts/run_stage4_successor_phase1.py \
            --historical-dir /tmp/stage36/data/historical_processed/stage36_freeze_v1 \
            --output-dir analysis/stage4_successor_phase1
      - name: Upload Phase 1 results
        uses: actions/upload-artifact@v4
        with:
          name: stage4-successor-phase1-results
          path: analysis/stage4_successor_phase1/
          if-no-files-found: error
          retention-days: 90
      - name: Commit Phase 1 measured outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/stage4_successor_phase1/
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: record Stage 4 successor phase 1 diagnostics'
            git pull --rebase origin stage4-successor-phase1
            git push origin HEAD:stage4-successor-phase1
          fi
