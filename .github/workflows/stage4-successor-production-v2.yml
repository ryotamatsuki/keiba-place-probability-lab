name: Stage 4 successor production v2

on:
  push:
    branches: [stage4-successor-production-v2]
    paths:
      - docs/STAGE4_SUCCESSOR_PRODUCTION_V2_SPEC.md
      - scripts/run_stage4_successor_production_v2.py
      - src/keiba_place_lab/stage4_production_v2.py
      - tests/test_stage4_production_v2.py
      - .github/workflows/stage4-successor-production-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: stage4-successor-production-v2
  cancel-in-progress: true

jobs:
  fit-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,historical,modeldev]"
      - name: Unit tests
        run: |
          ruff check .
          pytest -q tests/test_stage4_production_v2.py tests/test_stage4_successor_phase3a.py tests/test_nonmarket.py
      - name: Download frozen Stage 3.6 panel
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Fit production successor and score frozen target
        run: |
          mkdir -p /tmp/stage4-v2-model
          python -u scripts/run_stage4_successor_production_v2.py \
            --historical-dir /tmp/stage36/data/historical_processed/stage36_freeze_v1 \
            --target analysis/2026-10-03_kyoto11_opal/canonical_nonmarket_features_v1.csv \
            --output-dir analysis/2026-10-03_kyoto11_opal/stage4_successor_v2 \
            --model-output /tmp/stage4-v2-model/stage4_successor_v2.joblib
      - name: Upload production model and report
        uses: actions/upload-artifact@v4
        with:
          name: stage4-successor-production-v2
          path: |
            /tmp/stage4-v2-model/stage4_successor_v2.joblib
            analysis/2026-10-03_kyoto11_opal/stage4_successor_v2/
          if-no-files-found: error
          retention-days: 90
      - name: Commit production rehearsal outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/2026-10-03_kyoto11_opal/stage4_successor_v2/
          if ! git diff --cached --quiet; then
            git commit -m 'analysis: record Stage 4 successor v2 production rehearsal'
            git pull --rebase origin stage4-successor-production-v2
            git push origin HEAD:stage4-successor-production-v2
          fi
