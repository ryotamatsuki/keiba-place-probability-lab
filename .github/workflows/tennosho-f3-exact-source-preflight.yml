name: Tennosho F3 exact original source preflight
on:
  push:
    branches: [research/tennosho-akiten-preoff-20261101]
    paths: [.github/workflows/tennosho-f3-exact-source-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pandas==2.3.3' 'pyarrow==22.0.0' kagglehub
      - uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - run: |
          python - <<'PY'
          import hashlib
          import pandas as pd
          import kagglehub
          from pathlib import Path
          root=Path('/tmp/stage36')
          matches=list(root.rglob('standardized_jra_flat_source_v1.parquet'))
          assert len(matches)==1, f"Frozen base expected exactly once; found {matches}"
          base=matches[0]
          digest=hashlib.sha256(base.read_bytes()).hexdigest()
          assert digest=='d8bf137d851a241bb29be7518f1ea6bbcda4aa3dcc350ae03c081ee93d099127',digest
          frame=pd.read_parquet(base)
          frame.race_date=pd.to_datetime(frame.race_date)
          print('frozen base',str(base),'rows',len(frame),'races',frame.race_id.nunique(),'2025 races',frame.loc[frame.race_date.dt.year.eq(2025),'race_id'].nunique(),flush=True)
          path=Path(kagglehub.dataset_download(
             'noriyukifurufuru/japan-horse-racing-2010-2025/versions/1',
             output_dir='/tmp/kaggle_v1'
          ))
          result=list(path.rglob('keiba_results.csv'))
          races=list(path.rglob('keiba_races.csv'))
          assert len(result)==1 and len(races)==1,(result,races)
          hashresult=hashlib.sha256(result[0].read_bytes()).hexdigest()
          assert hashresult=='fb9345273b21a7c23d41260dc77e45134a1bc2fe756899f3416b24ac0dd51de3',hashresult
          idset=set()
          for chunk in pd.read_csv(result[0],usecols=['race_id'],dtype=str,on_bad_lines='skip',chunksize=250000):
              idset.update(chunk.race_id.dropna())
          base25=set(frame.loc[frame.race_date.dt.year.eq(2025),'race_id'].astype(str))
          missing=base25-idset
          print('Kaggle v1 exact SHA',hashresult,'races',len(idset),'2025 missing full races',len(missing),'example',sorted(missing)[:10],flush=True)
          assert len(missing)<=70,'2025 supplement >70; source augmentation strategy must be revised'
          PY
