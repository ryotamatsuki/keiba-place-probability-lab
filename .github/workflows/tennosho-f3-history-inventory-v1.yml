name: Tennosho 2026 17-horse F3 inventory checkpoint
on:
  push:
    branches:
      - research/tennosho-akiten-preoff-20261101
    paths:
      - .github/workflows/tennosho-f3-history-inventory-v1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tennosho-akiten-preoff-20261101
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact historical dependencies
        run: |
          python -m pip install -e '.[historical]' -c requirements-scope.txt
      - name: Check all 17 public JRA flat history profiles through October 30
        run: |
          python -u scripts/tennosho_f3_history_inventory.py \
            --config config/tennosho_preoff_20261101.json \
            --historical data/live_history/2026/snapshots/jra_flat_live_history_v1-20261003-f6ef42cd4ce3/jra_flat_history.parquet \
            --output analysis/tennosho_preoff_20261101/history_inventory_asof_20261030.json
      - name: Commit immutable independent inventory only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/tennosho_preoff_20261101/history_inventory_asof_20261030.json
          git commit -m 'research: evidence 17-horse historical inventories as of Oct 30'
          for i in 1 2 3; do
            git fetch origin research/tennosho-akiten-preoff-20261101
            git rebase origin/research/tennosho-akiten-preoff-20261101
            if git push origin HEAD:research/tennosho-akiten-preoff-20261101; then exit 0; fi
          done
          exit 1
