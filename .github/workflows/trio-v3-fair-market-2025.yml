name: Fair 2025 trio market maximum entropy comparison
on:
  push:
    branches: [research/trio-v3-matched-oof-20261031]
    paths: [.github/workflows/trio-v3-fair-market-2025.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trio-v3-fair-market-2025
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/trio-v3-matched-oof-20261031
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Validate exact same set of frozen F3 2025 runner predictions
        run: |
          ruff check --select E4,E7,E9,F scripts/evaluate_trio_market_maxent_2025.py
          python -u scripts/evaluate_trio_market_maxent_2025.py \
            --runners analysis/f3_frozen_2025_independent_holdout/2025_frozen_F3_runner_predictions.csv \
            --existing-v1 analysis/f3_frozen_2025_independent_holdout/2025_frozen_F3_trio_race_scores.csv \
            --out analysis/trio_v3_fair_market_2025
      - name: Archive strict paired historical 2025 comparators
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/trio_v3_fair_market_2025/
          git commit -m 'research: compare same-structure market and F3 maximum entropy on 2025'
          for i in 1 2 3 4; do
            git fetch origin research/trio-v3-matched-oof-20261031
            git rebase origin/research/trio-v3-matched-oof-20261031
            if git push origin HEAD:research/trio-v3-matched-oof-20261031; then exit 0; fi
          done
          exit 1
