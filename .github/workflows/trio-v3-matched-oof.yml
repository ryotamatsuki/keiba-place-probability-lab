name: Research Trio V3 matched F3 800+400 yearly OOF
# Second experiment includes stricter source checks and latest V3 unit tests.
on:
  push:
    branches: [research/trio-v3-matched-oof-20261031]
    paths: [.github/workflows/trio-v3-matched-oof.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: trio-v3-matched-oof
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/trio-v3-matched-oof-20261031
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Match original frozen training dependencies
        run: |
          python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
          python -m pip install 'catboost==1.2.10' 'lightgbm==4.7.0'
      - name: Lint and unit tests
        run: |
          ruff check --select E4,E7,E9,F src/keiba_place_lab/trio_context_v3.py scripts/research_trio_v3_matched_oof.py tests/test_trio_context_v3.py
          pytest -q tests/test_trio_context_v3.py tests/test_trio_bridge_v1.py tests/test_trio_residual_v2.py tests/test_tennosho_preoff_20261101.py
      - name: Restore original pre-2025 feature panel
        uses: actions/download-artifact@v4
        with:
          name: stage36-historical-training-panel-v1
          path: /tmp/stage36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37104212189
      - name: Download exact source V1 JRA metadata, full-field win odds and results
        run: |
          python - <<'PY'
          import kagglehub
          print(kagglehub.dataset_download(
              'noriyukifurufuru/japan-horse-racing-2010-2025/versions/1',
              output_dir='/tmp/kaggle_trio_matched_v3'
          ))
          PY
      - name: Train 2018-2022 for 2023 and 2018-2023 for 2024 with EXACT F3 800/400 settings
        run: |
          set -euo pipefail
          RESULT=$(find /tmp/kaggle_trio_matched_v3 -name keiba_results.csv -print -quit)
          RACES=$(find /tmp/kaggle_trio_matched_v3 -name keiba_races.csv -print -quit)
          test -s "$RESULT" && test -s "$RACES"
          python -u scripts/research_trio_v3_matched_oof.py \
            --historical-dir /tmp/stage36/data/historical_processed/stage36_freeze_v1 \
            --results "$RESULT" --races "$RACES" \
            --frozen-manifest models/tennosho_f3_20261101/manifest.json \
            --out analysis/trio_v3_matched_oof
      - name: Save research scores and provenance on isolated branch only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/trio_v3_matched_oof/
          git commit -m 'research: freeze matched 800/400 2023/24 OOF and conditional joint scores'
          for k in 1 2 3 4 5; do
            git fetch origin research/trio-v3-matched-oof-20261031
            git rebase origin/research/trio-v3-matched-oof-20261031
            if git push origin HEAD:research/trio-v3-matched-oof-20261031; then exit 0; fi
          done
          exit 1
