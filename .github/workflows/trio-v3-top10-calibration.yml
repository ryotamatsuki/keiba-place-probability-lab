name: Trio V3 matched 2024 top10 coverage and calibration
on:
  push:
    branches: [research/trio-v3-matched-oof-20261031]
    paths: [.github/workflows/trio-v3-top10-calibration.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trio-v3-top10-calibration
  cancel-in-progress: false
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/trio-v3-matched-oof-20261031
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Calculate paired 2024 top10 coverage confidence intervals
        run: |
          ruff check --select E4,E7,E9,F scripts/evaluate_trio_v3_top10_calibration.py
          python -u scripts/evaluate_trio_v3_top10_calibration.py \
            --source analysis/trio_v3_matched_oof/2024_comparable_complete_trio_scores.csv \
            --out analysis/trio_v3_2024_top10
      - name: Commit derived calibration statistics on isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/trio_v3_2024_top10/
          git commit -m 'research: archive 2024 trio top10 coverage uncertainty and decile calibration'
          for k in 1 2 3 4 5; do
            git fetch origin research/trio-v3-matched-oof-20261031
            git rebase origin/research/trio-v3-matched-oof-20261031
            if git push origin HEAD:research/trio-v3-matched-oof-20261031; then exit 0; fi
          done
          exit 1
