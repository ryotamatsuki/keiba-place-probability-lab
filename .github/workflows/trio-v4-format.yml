name: Research V4 format only (Ruff) and rerun reproducible test gate
on:
  push:
    branches: [research/trio-structures-and-pooling-v4-20261031]
    paths: [.github/workflows/trio-v4-format.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/trio-structures-and-pooling-v4-20261031
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.17.3
      - run: |
          ruff check --fix --unsafe-fixes \
            src/keiba_place_lab/trio_pool_v4.py \
            src/keiba_place_lab/trio_covariate_rank_v4.py \
            scripts/research_trio_v4_postmix.py \
            scripts/research_trio_v4_rank.py \
            tests/test_trio_pool_v4.py \
            tests/test_trio_covariate_rank_v4.py \
            scripts/research_trio_v4_tabm.py \
            scripts/research_trio_v4_xgb_depth.py \
            tests/test_trio_tabm_v4.py
          ruff check .
      - name: Persist purely mechanical lint corrections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/keiba_place_lab/trio_pool_v4.py \
            src/keiba_place_lab/trio_covariate_rank_v4.py \
            scripts/research_trio_v4_postmix.py \
            scripts/research_trio_v4_rank.py \
            tests/test_trio_pool_v4.py \
            tests/test_trio_covariate_rank_v4.py \
            scripts/research_trio_v4_tabm.py \
            scripts/research_trio_v4_xgb_depth.py \
            tests/test_trio_tabm_v4.py
          if git diff --staged --quiet; then echo "No lint changes"; exit 0; fi
          git commit -m "ci: Ruff mechanical formatting of research V4 scripts"
          for i in 1 2 3 4 5; do
            git fetch origin research/trio-structures-and-pooling-v4-20261031
            git rebase origin/research/trio-structures-and-pooling-v4-20261031
            if git push origin HEAD:research/trio-structures-and-pooling-v4-20261031; then exit 0; fi
          done
          exit 1
