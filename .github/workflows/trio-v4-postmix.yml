name: Trio V4 prereg posttransform arithmetic ensemble 2023 -> 2024
# Relaunch after initial unit-test script lands.
on:
  push:
    branches: [research/trio-structures-and-pooling-v4-20261031]
    paths: [.github/workflows/trio-v4-postmix.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trio-v4-postmix
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/trio-structures-and-pooling-v4-20261031
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev,historical,modeldev]' -c requirements-scope.txt
      - name: Test fixed joint semantics before real-data evaluation
        run: |
          ruff check --select E4,E7,E9,F src/keiba_place_lab/trio_pool_v4.py scripts/research_trio_v4_postmix.py tests/test_trio_pool_v4.py
          pytest -q tests/test_trio_pool_v4.py tests/test_trio_bridge_v1.py
      - name: Calculate exact matched 800/400 OOF pair mixtures without base retraining
        run: |
          python -u scripts/research_trio_v4_postmix.py \
            --oof analysis/trio_v3_matched_oof/2023_2024_matched_800_400_oof.csv \
            --pr40-2024 analysis/trio_v3_matched_oof/2024_comparable_complete_trio_scores.csv \
            --pr40-2023 analysis/trio_v3_matched_oof/2023_training_year_diagnostics.csv \
            --out analysis/trio_v4_postmix
      - name: Archive predictions and pre-year weights on isolated research branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/trio_v4_postmix/
          git commit -m 'research: archive chronological post-V1 ensemble 2024 all-ticket joint predictions'
          for i in 1 2 3 4 5; do
            git fetch origin research/trio-structures-and-pooling-v4-20261031
            git rebase origin/research/trio-structures-and-pooling-v4-20261031
            if git push origin HEAD:research/trio-structures-and-pooling-v4-20261031; then exit 0; fi
          done
          exit 1
