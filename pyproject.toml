[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba-place-probability-lab"
version = "0.1.0"
description = "Auditable pre-race place-probability experiments for Japanese horse racing"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.7",
]
modeling = [
  "xgboost>=3.0,<4",
]
historical = [
  "kaggle>=1.6",
  "kagglehub>=1.0",
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "pymupdf>=1.26",
  "pyarrow>=18",
  "tabulate>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
